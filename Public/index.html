<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interlinked</title>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">

  <h1>Interlinked</h1>

  <input id="userIdInput" placeholder="Enter email or phone" />

  <select id="countrySelect">
    <option value="India">India</option>
    <option value="USA">USA</option>
    <option value="UK">UK</option>
  </select>

  <button id="startBtn">Start Chat</button>

</div>

<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen hidden">
    <div class="loader"></div>
    <p>Finding someone for you...</p>
</div>

<!-- MAIN CHAT APP -->
<div id="chatApp" class="app hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <h2>Interlinked</h2>

    <button id="nextBtn">Next</button>

  </aside>

  <!-- CHAT SECTION -->
  <main class="chat-section">

    <div class="chat-header">

      <div>
        <h3>Random Stranger</h3>
        <span class="status">Online</span>
      </div>

    </div>

    <!-- CHAT BOX -->
    <div class="chat-box"></div>

    <!-- TYPING STATUS -->
    <div class="typing-status" id="typingStatus">
        Stranger is typing...
    </div>
<div id="typingIndicator" class="typing hidden">
    Stranger is typing...
</div>
    <!-- INPUT AREA -->
    <div class="chat-input-area">

      <input id="messageInput" placeholder="Type a message..." />

      <button id="sendBtn">Send</button>

    </div>

  </main>

</div>


<!-- SOCKET + SCRIPT -->
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
